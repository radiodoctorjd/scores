<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sports Scores Dashboard</title>
<link rel="icon" type="image/x-icon" href="images/favicon_4dot.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin:0; background:#0f172a; color:white; }
header { padding:15px; text-align:center; font-size:24px; font-weight:bold; background:#020617; letter-spacing:0.2px; }

.tabs { display:flex; overflow-x:auto; background:#1e293b; position:sticky; top:0; z-index:1000; }
.tab { padding:12px 18px; cursor:pointer; display:flex; align-items:center; white-space:nowrap; }
.tab img { width:20px; margin-right:6px; }
.tab.active { border-bottom:3px solid #38bdf8; background:#0f172a; }

.section-title { text-align:center; font-weight:bold; margin:10px 0; }

.content { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:20px; }
@media(max-width:1024px){ .content { grid-template-columns:repeat(2,1fr); } }
@media(max-width:800px){ .content { grid-template-columns:1fr; } }

.game { background:white; color:black; padding:14px; border-radius:14px; box-shadow:0 8px 24px rgba(2,6,23,0.12); }

.team-line { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; line-height:1.2; }
.team-line img { width:26px; flex:0 0 auto; }

.matchup-text { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.matchup-at { opacity:0.65; font-weight:700; }

.details-toggle { width:100%; margin-top:10px; border:1px solid #dbe4ee; background:#f8fafc; color:#0f172a; border-radius:10px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; text-align:left; }
.details-toggle:hover { background:#f1f5f9; }
.details-panel { margin-top:8px; padding:10px; border-radius:10px; background:#f8fafc; border:1px solid #e2e8f0; display:none; }
.details-panel.open { display:block; }
.details-grid { display:grid; grid-template-columns:1fr; gap:8px; font-size:12px; color:#334155; }
.details-label { font-weight:700; color:#0f172a; margin-right:4px; }
.records-matchup { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.records-team-card { background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:10px; text-align:center; }
.records-team-name { font-size:14px; font-weight:800; color:#0f172a; letter-spacing:0.02em; }
.records-overall { margin-top:4px; font-size:14px; font-weight:700; color:#111827; }
.records-split { margin-top:6px; display:inline-block; font-size:12px; font-weight:700; color:#1d4ed8; background:rgba(29,78,216,0.08); padding:3px 8px; border-radius:999px; }
.leaders-matchup { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:2px; }
.leaders-team-card { background:#ffffff; border:1px solid #e2e8f0; border-radius:10px; padding:8px; }
.leaders-team-header { font-weight:700; color:#0f172a; margin-bottom:6px; }
.leaders-section-title { font-size:11px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.04em; margin:6px 0 4px; }
.leader-line { margin:2px 0; }
@media(max-width:640px){ .leaders-matchup, .records-matchup { grid-template-columns:1fr; } }

.spacer { height:6px; }
.divider { border-top:1px solid #ddd; margin:6px 0; }

.status { font-size:13px; color:#334155; line-height:1.35; }
.status strong { color:#111827; }
.status small { font-size:12px; }
.status-line {
    display:block;
    margin-top:2px;
}
.status-line:first-child {
    margin-top:0;
}

.pitchers {
    font-size:12px;
    color:#475569;
    margin-top:7px;
    margin-bottom:12px;
    line-height:1.35;
}

.score-lines {
    margin-top:4px;
    margin-bottom:4px;
}
.score-lines .score-value { font-weight:800; }
.score-lines .top-team-name, .score-lines .top-team-score { font-size:16px; }
.score-lines .bottom-team-name, .score-lines .bottom-team-score { font-size:14px; }

@keyframes pulse {
    0% { transform:scale(1); }
    50% { transform:scale(1.2); }
    100% { transform:scale(1); }
}
.live-badge {
    background:red;
    color:white;
    font-size:11px;
    padding:2px 6px;
    border-radius:10px;
    margin-right:6px;
    animation:pulse 1s infinite;
}

.scoreboard { margin-top:8px; font-size:12px; overflow-x:auto; border-radius:8px; }
.scoreboard table { width:100%; border-collapse:collapse; }
.scoreboard th, .scoreboard td { padding:4px 6px; text-align:center; }
.scoreboard th { border-bottom:1px solid #ccc; }
.scoreboard td { border-bottom:1px solid #eee; }
.team-cell { text-align:left !important; font-weight:bold; white-space:nowrap; }
.total-cell { font-weight:bold; }

@keyframes numberFlash {
    0% { transform:scale(1); opacity:1; }
    35% { transform:scale(1.22); opacity:0.75; }
    100% { transform:scale(1); opacity:1; }
}
.cell-value {
    display:inline-block;
}
.number-changed {
    animation:numberFlash 0.45s ease;
}

/* MLB count dots */
.count-wrap {
    display:inline-flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
.count-label {
    display:inline-flex;
    align-items:center;
    gap:4px;
}
.count-group {
    display:inline-flex;
    align-items:center;
    gap:3px;
    min-width:18px;
}
.dot {
    width:8px;
    height:8px;
    border-radius:50%;
    display:inline-block;
    border:1px solid rgba(0,0,0,0.18);
}
.dot.ball { background:#facc15; }
.dot.strike { background:#111827; }
.dot.out { background:#dc2626; }
.count-empty {
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#e5e7eb;
    border:1px solid rgba(0,0,0,0.08);
}

/* Base runner diamond - tightened */
.basepath-wrap {
    display:inline-flex;
    align-items:center;
    gap:4px;
    flex-wrap:wrap;
}
.baseball-diamond {
    position: relative;
    width: 28px;
    height: 20px;
    margin: 2px 4px;
}
.base {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #e5e7eb;
    border: 1px solid rgba(0,0,0,0.12);
    box-sizing: border-box;
    border-radius: 1px;
    transform: rotate(45deg);
}
.base.on {
    background: #22c55e;
    box-shadow: 0 0 5px rgba(34,197,94,0.4);
}
.base.second { top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
.base.third  { bottom: 0; left: 2px; }
.base.first  { bottom: 0; right: 2px; }

.watch-line { margin-top:8px; color:#475569; }

@media(max-width:800px){
    .game { padding:12px; border-radius:12px; }
    .team-line { font-size:15px; }
    .team-line img { width:22px; }
    .score-lines .top-team-name, .score-lines .top-team-score { font-size:15px; }
    .score-lines .bottom-team-name, .score-lines .bottom-team-score { font-size:13px; }
    .scoreboard th, .scoreboard td { padding:3px 4px; }
    .pitchers, .status, .details-grid { font-size:12px; }
}
</style>
</head>

<body>

<header>Sports Scores Dashboard</header>
<div class="tabs" id="tabs"></div>
<div id="content-container"></div>

<script>
const leagues = {
    NHL: "hockey/nhl",
    MLB: "baseball/mlb",
    NFL: "football/nfl",
    NBA: "basketball/nba",
    WNBA: "basketball/wnba",
    NCAAMB: "basketball/mens-college-basketball"
};

const leagueLogos = {
    NHL: "images/nhl.svg",
    MLB: "images/mlb.svg",
    NFL: "images/nfl.svg",
    NBA: "images/nba.svg",
    WNBA: "images/wnba.svg",
    NCAAMB: "images/ncaamb.svg"
};

let currentLeague = "NHL";
const tabsDiv = document.getElementById("tabs");
const containerDiv = document.getElementById("content-container");
let gameStateMap = {};
let refreshInFlight = false;

const goalieCache = new Map();
const TEAM_ALIAS_MAP = {
    ANA:['ANA','DUCKS'], BOS:['BOS','BRUINS'], BUF:['BUF','SABRES'], CAR:['CAR','HURRICANES'], CBJ:['CBJ','BLUE JACKETS','COLUMBUS'], CGY:['CGY','FLAMES'], CHI:['CHI','BLACKHAWKS'], COL:['COL','AVALANCHE'], DAL:['DAL','STARS'], DET:['DET','RED WINGS'], EDM:['EDM','OILERS'], FLA:['FLA','PANTHERS'], LAK:['LA','LAK','KINGS'], MIN:['MIN','WILD'], MTL:['MON','MTL','CANADIENS'], NJD:['NJ','NJD','DEVILS'], NSH:['NSH','PREDATORS'], NYI:['NYI','ISLANDERS'], NYR:['NYR','RANGERS'], OTT:['OTT','SENATORS'], PHI:['PHI','FLYERS'], PIT:['PIT','PENGUINS'], SEA:['SEA','KRAKEN'], SJS:['SJ','SJS','SHARKS'], STL:['STL','BLUES'], TBL:['TB','TBL','LIGHTNING'], TOR:['TOR','MAPLE LEAFS'], UTA:['UTA','UTAH'], VAN:['VAN','CANUCKS'], VGK:['VGK','GOLDEN KNIGHTS'], WPG:['WPG','JETS'], WSH:['WSH','CAPITALS']
};

function normalizeNhlAbbr(abbr){
    const val = String(abbr || '').toUpperCase().trim();
    for(const [canon, aliases] of Object.entries(TEAM_ALIAS_MAP)){
        if(aliases.includes(val)) return canon;
    }
    return val;
}

function goalieLineHtml(teamAbbr, goalie){
    const name = goalie?.name || 'TBD';
    const status = goalie?.status ? `<span class="goalie-status">(${goalie.status})</span>` : '';
    return `<div>${teamAbbr}: ${name}${status}</div>`;
}

function parseGoaliesFromRotowireHtml(html){
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const result = {};

    const boxes = Array.from(doc.querySelectorAll('[class*="lineup__box"], .lineup__box'));
    for(const box of boxes){
        const teamNodes = Array.from(box.querySelectorAll('[class*="lineup__abbr"], .lineup__abbr'));
        const teams = teamNodes.map(n => normalizeNhlAbbr(n.textContent)).filter(Boolean);
        if(teams.length < 2) continue;

        const text = box.textContent.replace(/\s+/g, ' ').trim();
        const goalieNames = [];
        const playerNodes = Array.from(box.querySelectorAll('[class*="lineup__player"], .lineup__player, a[href*="/hockey/player/"]'));
        for(const node of playerNodes){
            const name = (node.textContent || '').replace(/\s+/g, ' ').trim();
            if(!name || goalieNames.includes(name)) continue;
            if(name.length < 4) continue;
            goalieNames.push(name);
        }

        const statusMatches = [...text.matchAll(/\b(Confirmed|Expected|Likely|Projected|Unconfirmed)\b/gi)].map(m => m[1]);

        if(goalieNames[0]) result[teams[0]] = { name: goalieNames[0], status: statusMatches[0] || 'Projected' };
        if(goalieNames[1]) result[teams[1]] = { name: goalieNames[1], status: statusMatches[1] || 'Projected' };
    }

    if(Object.keys(result).length) return result;

    const plain = doc.body?.textContent || html;
    return parseGoaliesFromText(plain);
}

function parseGoaliesFromText(text){
    const cleaned = String(text || '')
        .replace(/\r/g, '\n')
        .replace(/[ \t]+/g, ' ')
        .replace(/Image:\s*/g, '')
        .replace(/\n{2,}/g, '\n');
    const lines = cleaned.split('\n').map(s => s.trim()).filter(Boolean);
    const out = {};

    for(let i = 0; i < lines.length; i++) {
        const line = lines[i].toUpperCase();
        const abbrMatch = Object.keys(TEAM_ALIAS_MAP).find(abbr => new RegExp(`\\b${abbr}\\b`).test(line));
        if(!abbrMatch) continue;

        let goalieName = '';
        let status = '';
        for(let j = i + 1; j < Math.min(i + 8, lines.length); j++) {
            const candidate = lines[j];
            if(/^(Confirmed|Expected|Likely|Projected|Unconfirmed)$/i.test(candidate)) {
                status = candidate;
                continue;
            }
            if(/^[A-Z]{2,4}$/.test(candidate)) break;
            if(!goalieName && /^[A-Z][a-z]+(?:[-' .][A-Z][a-z]+)+$/.test(candidate)) goalieName = candidate;
            if(goalieName && status) break;
        }
        if(goalieName) out[abbrMatch] = { name: goalieName, status: status || 'Projected' };
    }
    return out;
}

async function fetchText(url){
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.text();
}

async function fetchJson(url){
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
}

async function loadNhlGoalies(){
    const cacheKey = getDate(0);
    if(goalieCache.has(cacheKey)) return goalieCache.get(cacheKey);

    const target = 'https://www.rotowire.com/hockey/nhl-lineups.php';
    const attempts = [
        () => fetchText(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`),
        async () => (await fetchJson(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`)).contents || '',
        () => fetchText(`https://r.jina.ai/http://${target.replace(/^https?:\/\//, '')}`),
        () => fetchText(target)
    ];

    for(const attempt of attempts){
        try {
            const payload = await Promise.race([attempt(), new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))]);
            if(!payload || String(payload).length < 100) continue;
            const parsed = /<html/i.test(payload) ? parseGoaliesFromRotowireHtml(payload) : parseGoaliesFromText(payload);
            if(parsed && Object.keys(parsed).length){
                goalieCache.set(cacheKey, parsed);
                return parsed;
            }
        } catch (err) {
            console.warn('Goalie source failed:', err);
        }
    }

    goalieCache.set(cacheKey, {});
    return {};
}

async function populateVisibleGoalies(){
    if(currentLeague !== 'NHL') return;
    const goalies = await loadNhlGoalies();
    document.querySelectorAll('.game[data-event-id] .goalies').forEach(box => {
        const away = normalizeNhlAbbr(box.dataset.awayAbbr);
        const home = normalizeNhlAbbr(box.dataset.homeAbbr);
        box.innerHTML = `
            ${goalieLineHtml(box.dataset.awayAbbr, goalies[away])}
            ${goalieLineHtml(box.dataset.homeAbbr, goalies[home])}
        `;
    });
}

Object.keys(leagues).forEach(l => {
    const tab = document.createElement("div");
    tab.className = "tab" + (l === currentLeague ? " active" : "");
    tab.innerHTML = `<img src="${leagueLogos[l]}" alt="${l} logo">${l}`;
    tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentLeague = l;
        loadGames();
    };
    tabsDiv.appendChild(tab);
});

function getSortedTeams(home, away){
    if(home.score == null || away.score == null) return [away, home];
    return Number(home.score) >= Number(away.score) ? [home, away] : [away, home];
}

function extractEraValue(p){
    if(!p) return "--";

    const stats = Array.isArray(p.statistics) ? p.statistics : [];
    const direct = stats.find(s => String(s?.name || '').toLowerCase() === 'era')?.displayValue;
    if(direct && direct !== '0' && direct !== '0.00') return direct.replace(/\s*ERA$/i, '').trim();

    const candidates = [
        ...stats.map(s => s?.displayValue),
        ...stats.map(s => s?.summary),
        p?.displayValue,
        p?.summary,
        p?.shortDisplayName,
        p?.displayName
    ].filter(Boolean);

    for(const value of candidates){
        const match = String(value).match(/(\d+\.\d+)\s*ERA/i);
        if(match) return match[1];
    }

    for(const value of candidates){
        const match = String(value).match(/(\d+\.\d+)/);
        if(match) return match[1];
    }

    return '--';
}

function formatPitcher(p){
    if(!p) return "TBD";
    const name = p.athlete?.displayName || "TBD";
    const era = extractEraValue(p);
    return `${name} (${era} ERA)`;
}

function getSituation(event){
    const comp = event.competitions?.[0] || {};
    return event.situation || comp.situation || {};
}

function buildDots(count, type, maxCount){
    let html = '<span class="count-group">';
    for(let i = 0; i < maxCount; i++){
        if(i < count){
            html += `<span class="dot ${type}"></span>`;
        } else {
            html += `<span class="count-empty"></span>`;
        }
    }
    html += '</span>';
    return html;
}

function getBaseOccupancy(situation){
    const athletes = situation?.onFirst || situation?.onSecond || situation?.onThird
        ? null
        : (situation?.runners || situation?.baseRunners || situation?.athletes || []);

    const first = !!(
        situation?.onFirst ||
        situation?.first ||
        athletes?.some?.(r => r?.base === 1 || r?.currentBase === 1 || r?.baseNumber === 1)
    );

    const second = !!(
        situation?.onSecond ||
        situation?.second ||
        athletes?.some?.(r => r?.base === 2 || r?.currentBase === 2 || r?.baseNumber === 2)
    );

    const third = !!(
        situation?.onThird ||
        situation?.third ||
        athletes?.some?.(r => r?.base === 3 || r?.currentBase === 3 || r?.baseNumber === 3)
    );

    return { first, second, third };
}

function buildBaseDiamondHTML(situation){
    const bases = getBaseOccupancy(situation);

    return `
        <span class="basepath-wrap">
            <span>Bases:</span>
            <span class="baseball-diamond" aria-label="Base runner diamond">
                <span class="base second ${bases.second ? 'on' : ''}"></span>
                <span class="base third ${bases.third ? 'on' : ''}"></span>
                <span class="base first ${bases.first ? 'on' : ''}"></span>
            </span>
        </span>
    `;
}

function buildGameState(event){
    const comp = event.competitions[0];
    const home = comp.competitors.find(t => t.homeAway === "home");
    const away = comp.competitors.find(t => t.homeAway === "away");
    const situation = getSituation(event);
    const bases = getBaseOccupancy(situation);

    return JSON.stringify({
        state: event.status.type.state,
        completed: event.status.type.completed,
        detail: event.status.type.detail,
        shortDetail: event.status.type.shortDetail,
        homeScore: home.score,
        awayScore: away.score,
        balls: situation.balls ?? null,
        strikes: situation.strikes ?? null,
        outs: situation.outs ?? null,
        onFirst: bases.first,
        onSecond: bases.second,
        onThird: bases.third,
        homeLines: (home.linescores || []).map(ls => ({
            period: ls.period ?? null,
            value: ls.value ?? "",
            displayValue: ls.displayValue ?? ""
        })),
        awayLines: (away.linescores || []).map(ls => ({
            period: ls.period ?? null,
            value: ls.value ?? "",
            displayValue: ls.displayValue ?? ""
        }))
    });
}

function getDate(offset){
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function formatGameTime(dateString){
    return new Date(dateString).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function getStatusText(event){
    const situation = getSituation(event);
    const isFinal = event.status.type.completed;
    const isLive = event.status.type.state === "in";

    let inningText;

    if(isFinal){
        inningText = "Final";
    } else if(isLive){
        inningText = event.status.type.detail || event.status.type.shortDetail || "Live";
    } else {
        return `<strong>${formatGameTime(event.date)}</strong>`;
    }

    if(currentLeague === "MLB" && isLive){
        const balls = situation.balls ?? 0;
        const strikes = situation.strikes ?? 0;
        const outs = situation.outs ?? 0;

        const countLine = `
            <span class="status-line">
                <span class="count-wrap">
                    <span class="count-label">Balls: ${buildDots(balls, "ball", 3)}</span>
                    <span class="count-label">Strikes: ${buildDots(strikes, "strike", 2)}</span>
                    <span class="count-label">Outs: ${buildDots(outs, "out", 3)}</span>
                </span>
            </span>
        `;

        const baseLine = `
            <span class="status-line">
                ${buildBaseDiamondHTML(situation)}
            </span>
        `;

        return `
            <span class="status-line"><strong>${inningText}</strong></span>
            ${countLine}
            ${baseLine}
        `;
    }

    return inningText;
}

function normalizeLineScore(line, index){
    return {
        key: String(line?.period ?? index + 1),
        label: String(line?.period ?? index + 1),
        value: line?.displayValue ?? line?.value ?? ""
    };
}

function getTableData(away, home){
    const awayLines = (away.linescores || []).map(normalizeLineScore);
    const homeLines = (home.linescores || []).map(normalizeLineScore);

    if(!awayLines.length && !homeLines.length) return null;

    const allKeys = [];
    const keyMap = new Map();

    [...awayLines, ...homeLines].forEach((line, idx) => {
        if(!keyMap.has(line.key)){
            keyMap.set(line.key, {
                key: line.key,
                label: line.label || String(idx + 1)
            });
            allKeys.push(line.key);
        }
    });

    allKeys.sort((a, b) => {
        const na = Number(a);
        const nb = Number(b);
        const aNum = !Number.isNaN(na);
        const bNum = !Number.isNaN(nb);
        if(aNum && bNum) return na - nb;
        if(aNum) return -1;
        if(bNum) return 1;
        return a.localeCompare(b, undefined, { numeric:true, sensitivity:"base" });
    });

    const awayMap = new Map(awayLines.map(line => [line.key, line.value]));
    const homeMap = new Map(homeLines.map(line => [line.key, line.value]));

    return {
        columns: allKeys.map(key => ({
            key,
            label: keyMap.get(key)?.label || key
        })),
        away: {
            abbr: away.team.abbreviation,
            values: allKeys.map(key => awayMap.get(key) ?? ""),
            total: away.score ?? ""
        },
        home: {
            abbr: home.team.abbreviation,
            values: allKeys.map(key => homeMap.get(key) ?? ""),
            total: home.score ?? ""
        }
    };
}

function wrapCellValue(value){
    return `<span class="cell-value">${value ?? ""}</span>`;
}

function buildTableHTML(away, home){
    const tableData = getTableData(away, home);
    if(!tableData) return "";

    const header = tableData.columns.map(col => `<th data-col-key="${col.key}">${col.label}</th>`).join("");

    const awayCells = tableData.away.values
        .map((value, idx) => `<td data-col-key="${tableData.columns[idx].key}">${wrapCellValue(value)}</td>`)
        .join("");

    const homeCells = tableData.home.values
        .map((value, idx) => `<td data-col-key="${tableData.columns[idx].key}">${wrapCellValue(value)}</td>`)
        .join("");

    return `
        <div class="scoreboard">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        ${header}
                        <th>T</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="away-row">
                        <td class="team-cell">${tableData.away.abbr}</td>
                        ${awayCells}
                        <td class="total-cell" data-col-key="total">${wrapCellValue(tableData.away.total)}</td>
                    </tr>
                    <tr class="home-row">
                        <td class="team-cell">${tableData.home.abbr}</td>
                        ${homeCells}
                        <td class="total-cell" data-col-key="total">${wrapCellValue(tableData.home.total)}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
}

function animateChangedValue(element, newValue){
    if(!element) return;

    let target = element.querySelector(".cell-value");

    if(!target){
        const currentText = element.textContent.trim();
        element.textContent = "";
        target = document.createElement("span");
        target.className = "cell-value";
        target.textContent = currentText;
        element.appendChild(target);
    }

    const oldValue = target.textContent.trim();
    const nextValue = String(newValue ?? "").trim();

    if(oldValue === nextValue) return;

    target.textContent = nextValue;
    target.classList.remove("number-changed");
    void target.offsetWidth;
    target.classList.add("number-changed");
}

function animateTextSpan(span, newValue){
    if(!span) return;

    const oldValue = span.textContent.trim();
    const nextValue = String(newValue ?? "").trim();

    if(oldValue === nextValue) return;

    span.textContent = nextValue;
    span.classList.remove("number-changed");
    void span.offsetWidth;
    span.classList.add("number-changed");
}

function ensureScoreLines(gameDiv, isLive){
    let scoreDiv = gameDiv.querySelector(".score-lines");

    if(!scoreDiv){
        scoreDiv = document.createElement("div");
        scoreDiv.className = "score-lines";
        scoreDiv.innerHTML = `
            ${isLive ? '<div class="divider score-divider"></div>' : '<div class="spacer score-divider"></div>'}
            <div><strong><span class="team-name top-team-name"></span> - <span class="score-value top-team-score cell-value"></span></strong></div>
            <div><span class="team-name bottom-team-name"></span> - <span class="score-value bottom-team-score cell-value"></span></div>
            <div class="spacer"></div>
        `;

        const pitchersDiv = gameDiv.querySelector(".pitchers");
        if(pitchersDiv){
            pitchersDiv.insertAdjacentElement("afterend", scoreDiv);
        } else {
            const teamLine = gameDiv.querySelector(".team-line");
            teamLine.insertAdjacentElement("afterend", scoreDiv);
        }
    }

    const divider = scoreDiv.querySelector(".score-divider");
    if(divider){
        divider.className = (isLive ? "divider" : "spacer") + " score-divider";
    }

    return scoreDiv;
}

function updateScoreLines(gameDiv, topTeam, bottomTeam, isLive, isFinal){
    if(!isLive && !isFinal){
        const oldScore = gameDiv.querySelector(".score-lines");
        if(oldScore) oldScore.remove();
        return;
    }

    const scoreDiv = ensureScoreLines(gameDiv, isLive);

    const topNameEl = scoreDiv.querySelector(".top-team-name");
    const bottomNameEl = scoreDiv.querySelector(".bottom-team-name");
    const topScoreEl = scoreDiv.querySelector(".top-team-score");
    const bottomScoreEl = scoreDiv.querySelector(".bottom-team-score");

    if(topNameEl) topNameEl.textContent = topTeam.team.displayName;
    if(bottomNameEl) bottomNameEl.textContent = bottomTeam.team.displayName;
    animateTextSpan(topScoreEl, topTeam.score ?? "");
    animateTextSpan(bottomScoreEl, bottomTeam.score ?? "");
}

function updateStatusUI(gameDiv, event){
    const statusText = getStatusText(event);
    const statusDiv = gameDiv.querySelector(".game-status");

    if(statusDiv && statusDiv.innerHTML !== statusText){
        statusDiv.innerHTML = statusText;
    }

    const isLive = event.status.type.state === "in";
    const teamLine = gameDiv.querySelector(".team-line");
    const existingBadge = teamLine?.querySelector(".live-badge");

    if(isLive && !existingBadge){
        const badge = document.createElement("span");
        badge.className = "live-badge";
        badge.textContent = "LIVE";
        teamLine.prepend(badge);
    } else if(!isLive && existingBadge){
        existingBadge.remove();
    }

    const divider = gameDiv.querySelector(".status-divider");
    if(isLive){
        if(!divider){
            const newDivider = document.createElement("div");
            newDivider.className = "divider status-divider";
            statusDiv?.insertAdjacentElement("afterend", newDivider);
        } else {
            divider.className = "divider status-divider";
        }
    } else if(divider){
        divider.remove();
    }
}


function getRecordSummaryByAliases(team, aliases){
    const records = team?.records || [];
    const normalizedAliases = (aliases || []).map(alias => String(alias).toLowerCase());

    const match = records.find(record => {
        const fields = [record?.name, record?.type, record?.displayName, record?.abbreviation]
            .filter(Boolean)
            .map(value => String(value).toLowerCase());
        return normalizedAliases.some(alias => fields.includes(alias));
    });

    return match?.summary || null;
}

function getOverallRecord(team){
    return getRecordSummaryByAliases(team, ['overall', 'total'])
        || team?.record?.summary
        || team?.records?.[0]?.summary
        || '—';
}

function getHomeRoadRecord(team, side){
    if(side === 'home'){
        return getRecordSummaryByAliases(team, ['home']);
    }
    return getRecordSummaryByAliases(team, ['road', 'away']);
}

function formatTeamRecordLine(team, side){
    const overall = getOverallRecord(team);
    const split = getHomeRoadRecord(team, side);
    const splitLabel = side === 'home' ? 'At Home' : 'On The Road';

    return `${team.team.abbreviation} ${overall}${split ? ` (${split} ${splitLabel})` : ''}`;
}

function buildTeamRecordCard(team, side){
    const overall = getOverallRecord(team);
    const split = getHomeRoadRecord(team, side);
    const splitLabel = side === 'home' ? 'At Home' : 'On The Road';

    return `
        <div class="records-team-card">
            <div class="records-team-name">${team.team.abbreviation}</div>
            <div class="records-overall">${overall}</div>
            ${split ? `<div class="records-split">${split} ${splitLabel}</div>` : ''}
        </div>
    `;
}

function formatLeaderCategoryName(name){
    if(!name) return 'Leader';

    const normalized = String(name)
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/_/g, ' ')
        .trim()
        .toLowerCase();

    const abbreviations = {
        'at bats': 'AB',
        'runs': 'R',
        'hits': 'H',
        'runs batted in': 'RBI',
        'rbi': 'RBI',
        'home runs': 'HR',
        'batting average': 'AVG',
        'average': 'AVG',
        'on base percentage': 'OBP',
        'slugging percentage': 'SLG',
        'ops': 'OPS',
        'stolen bases': 'SB',
        'walks': 'BB',
        'strikeouts': 'K',
        'innings pitched': 'IP',
        'earned runs': 'ER',
        'hits allowed': 'H',
        'pitch count': 'P',
        'pitches': 'P',
        'wins': 'W',
        'saves': 'SV',
        'points': 'PTS',
        'rebounds': 'REB',
        'assists': 'AST',
        'blocks': 'BLK',
        'steals': 'STL',
        'goals': 'G',
        'shots on goal': 'SOG',
        'save percentage': 'SV%',
        'saves': 'SV',
        'passing yards': 'Pass Yds',
        'rushing yards': 'Rush Yds',
        'receiving yards': 'Rec Yds',
        'touchdowns': 'TD'
    };

    if(abbreviations[normalized]) return abbreviations[normalized];

    return normalized.replace(/\w/g, ch => ch.toUpperCase());
}

function getMLBLeaderBucket(name){
    const normalized = String(name || '').toLowerCase().replace(/_/g, ' ');
    const pitchingTerms = ['strikeout', 'innings pitched', 'earned run', 'pitch count', 'pitches', 'save', 'win', 'era', 'whip', 'hits allowed'];
    return pitchingTerms.some(term => normalized.includes(term)) ? 'Pitching' : 'Batting';
}

function renderLeaderLines(categories){
    return categories.map(category => {
        const leader = category?.leaders?.[0];
        const playerName = leader?.athlete?.displayName || leader?.displayName || '—';
        const stat = leader?.displayValue || '';
        const label = formatLeaderCategoryName(category?.name);
        if(!stat && playerName === '—') return '';
        return `<div class="leader-line"><span class="details-label">${label}:</span>${playerName}${stat ? ` (${stat})` : ''}</div>`;
    }).filter(Boolean).join('');
}

function getFirstMatchingLeader(categories, aliases){
    return aliases.map(alias => String(alias).toLowerCase())
        .map(alias => categories.find(category => String(category?.name || '').toLowerCase().replace(/_/g, ' ') === alias))
        .find(Boolean) || null;
}

function getPreferredMLBCategories(categories){
    const cleaned = (categories || []).filter(category => {
        const name = String(category?.name || '').toLowerCase().replace(/_/g, ' ');
        return name && name !== 'mlbrating' && name !== 'mlb rating' && name !== 'average' && name !== 'avg';
    });

    const preferredBatting = [
        getFirstMatchingLeader(cleaned, ['runs', 'run']),
        getFirstMatchingLeader(cleaned, ['hits', 'hit']),
        getFirstMatchingLeader(cleaned, ['rbi', 'rbis', 'runs batted in']),
        getFirstMatchingLeader(cleaned, ['home runs', 'home run', 'hr'])
    ].filter(Boolean);

    const preferredPitching = [
        getFirstMatchingLeader(cleaned, ['innings pitched', 'ip']),
        getFirstMatchingLeader(cleaned, ['strikeouts', 'strikeout', 'k']),
        getFirstMatchingLeader(cleaned, ['earned runs', 'earned run', 'er'])
    ].filter(Boolean);

    const fallbackPitching = cleaned.filter(category => getMLBLeaderBucket(category?.name) === 'Pitching');
    const fallbackBatting = cleaned.filter(category => getMLBLeaderBucket(category?.name) === 'Batting');

    const uniqueByName = list => {
        const seen = new Set();
        return list.filter(category => {
            const key = String(category?.name || '').toLowerCase().replace(/_/g, ' ');
            if(!key || seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    };

    return {
        batting: uniqueByName([
            ...preferredBatting,
            ...fallbackBatting
        ]).slice(0, 4),
        pitching: uniqueByName([
            ...preferredPitching,
            ...fallbackPitching
        ]).slice(0, 4)
    };
}

function formatTeamLeaders(team){
    const categories = team?.leaders || [];
    if(!categories.length) return '';

    if(currentLeague === 'MLB'){
        const preferred = getPreferredMLBCategories(categories);
        const battingHTML = renderLeaderLines(preferred.batting);
        const pitchingHTML = renderLeaderLines(preferred.pitching);

        if(!battingHTML && !pitchingHTML) return '';

        return `
            <div class="leaders-team-card">
                <div class="leaders-team-header">${team.team.abbreviation}</div>
                ${battingHTML ? `<div class="leaders-section-title">Batting</div>${battingHTML}` : ''}
                ${pitchingHTML ? `<div class="leaders-section-title">Pitching</div>${pitchingHTML}` : ''}
            </div>
        `;
    }

    const leadersHTML = renderLeaderLines(categories.slice(0, 3));
    if(!leadersHTML) return '';

    return `
        <div class="leaders-team-card">
            <div class="leaders-team-header">${team.team.abbreviation}</div>
            ${leadersHTML}
        </div>
    `;
}

function buildDetailsHTML(event, home, away){
    const comp = event.competitions?.[0] || {};
    const venue = comp.venue?.fullName || comp.venue?.address?.city || 'TBD';
    const statusDetail = event.status?.type?.detail || event.status?.type?.shortDetail || 'TBD';
    const broadcasts = (comp.broadcasts || []).flatMap(b => b.names || []).join(', ') || 'TBD';

    return `
        <div class="details-panel">
            <div class="details-grid">
                <div><span class="details-label">Venue:</span>${venue}</div>
                <div><span class="details-label">Status:</span>${statusDetail}</div>
                <div>
                    <span class="details-label">Records:</span>
                    <div class="records-matchup">
                        ${buildTeamRecordCard(away, 'away')}
                        ${buildTeamRecordCard(home, 'home')}
                    </div>
                </div>
                <div><span class="details-label">Watch:</span>${broadcasts}</div>
            </div>
        </div>
    `;
}

function bindDetailsToggle(gameDiv){
    const btn = gameDiv.querySelector('.details-toggle');
    const panel = gameDiv.querySelector('.details-panel');
    if(!btn || !panel) return;
    btn.addEventListener('click', () => {
        const open = panel.classList.toggle('open');
        btn.textContent = open ? 'Hide details ▲' : 'More details ▼';
    });
}

function updateScoreboardTable(gameDiv, away, home){
    const newTableData = getTableData(away, home);
    let scoreboard = gameDiv.querySelector(".scoreboard");

    if(!newTableData){
        if(scoreboard){
            scoreboard.remove();
            const spacerAfterTable = gameDiv.querySelector(".table-spacers");
            if(spacerAfterTable) spacerAfterTable.remove();
        }
        return;
    }

    if(!scoreboard){
        const statusDiv = gameDiv.querySelector(".game-status");
        if(statusDiv){
            statusDiv.insertAdjacentHTML("beforebegin", buildTableHTML(away, home) + `<div class="table-spacers"><div class="spacer"></div><div class="spacer"></div></div>`);
            return;
        }
    }

    scoreboard = gameDiv.querySelector(".scoreboard");
    if(!scoreboard) return;

    const existingHeaderKeys = Array.from(scoreboard.querySelectorAll("thead th[data-col-key]")).map(th => th.dataset.colKey);
    const newHeaderKeys = newTableData.columns.map(col => col.key);

    const structureChanged =
        existingHeaderKeys.length !== newHeaderKeys.length ||
        existingHeaderKeys.some((key, idx) => key !== newHeaderKeys[idx]);

    if(structureChanged){
        const wrapper = document.createElement("div");
        wrapper.innerHTML = buildTableHTML(away, home);
        scoreboard.replaceWith(wrapper.firstElementChild);
        return;
    }

    const awayRow = scoreboard.querySelector(".away-row");
    const homeRow = scoreboard.querySelector(".home-row");

    if(!awayRow || !homeRow){
        const wrapper = document.createElement("div");
        wrapper.innerHTML = buildTableHTML(away, home);
        scoreboard.replaceWith(wrapper.firstElementChild);
        return;
    }

    const awayTeamCell = awayRow.querySelector(".team-cell");
    const homeTeamCell = homeRow.querySelector(".team-cell");
    if(awayTeamCell) awayTeamCell.textContent = newTableData.away.abbr;
    if(homeTeamCell) homeTeamCell.textContent = newTableData.home.abbr;

    newTableData.columns.forEach((col, idx) => {
        animateChangedValue(awayRow.querySelector(`td[data-col-key="${col.key}"]`), newTableData.away.values[idx] ?? "");
        animateChangedValue(homeRow.querySelector(`td[data-col-key="${col.key}"]`), newTableData.home.values[idx] ?? "");
    });

    animateChangedValue(awayRow.querySelector(`td[data-col-key="total"]`), newTableData.away.total ?? "");
    animateChangedValue(homeRow.querySelector(`td[data-col-key="total"]`), newTableData.home.total ?? "");
}

function renderGame(event, grid){
    const comp = event.competitions[0];
    const home = comp.competitors.find(t => t.homeAway === "home");
    const away = comp.competitors.find(t => t.homeAway === "away");

    const isLive = event.status.type.state === "in";
    const isFinal = event.status.type.completed;
    const [topTeam, bottomTeam] = getSortedTeams(home, away);
    const statusText = getStatusText(event);
    const tableHTML = buildTableHTML(away, home);

    let scoreHTML = "";
    if(isLive || isFinal){
        scoreHTML = `
            <div class="score-lines">
                ${isLive ? '<div class="divider score-divider"></div>' : '<div class="spacer score-divider"></div>'}
                <div><strong><span class="team-name top-team-name">${topTeam.team.displayName}</span> - <span class="score-value top-team-score cell-value">${topTeam.score ?? ""}</span></strong></div>
                <div><span class="team-name bottom-team-name">${bottomTeam.team.displayName}</span> - <span class="score-value bottom-team-score cell-value">${bottomTeam.score ?? ""}</span></div>
                <div class="spacer"></div>
            </div>
        `;
    }

    let broadcast = "";
    if(!isFinal && comp.broadcasts?.length){
        broadcast = comp.broadcasts.flatMap(b => b.names || []).join(", ");
    }

    const gameDiv = document.createElement("div");
    gameDiv.className = "game";
    gameDiv.dataset.eventId = event.id;

    gameDiv.innerHTML = `
        <div class="team-line">
            ${isLive ? '<span class="live-badge">LIVE</span>' : ''}
            <div class="matchup-text">
                <img src="${away.team.logo}" alt="${away.team.abbreviation} logo"><span>${away.team.abbreviation}</span>
                <span class="matchup-at">@</span>
                <img src="${home.team.logo}" alt="${home.team.abbreviation} logo"><span>${home.team.abbreviation}</span>
            </div>
        </div>

        ${currentLeague === "MLB" ? `
        <div class="pitchers">
            <div>${away.team.abbreviation}: ${formatPitcher(away.probables?.[0])}</div>
            <div>${home.team.abbreviation}: ${formatPitcher(home.probables?.[0])}</div>
        </div>` : currentLeague === "NHL" ? `
        <div class="goalies goalie-loading" data-away-abbr="${away.team.abbreviation}" data-home-abbr="${home.team.abbreviation}">
            <div>${away.team.abbreviation}: TBD</div>
            <div>${home.team.abbreviation}: TBD</div>
        </div>` : ""}

        ${scoreHTML}
        ${tableHTML}
        ${tableHTML ? `<div class="table-spacers"><div class="spacer"></div><div class="spacer"></div></div>` : ""}

        <div class="status game-status">${statusText}</div>
        ${isLive ? '<div class="divider status-divider"></div>' : ""}
        ${broadcast ? `<div class="status watch-line"><small>Watch: ${broadcast}</small></div>` : ""}
        <button class="details-toggle" type="button">More details ▼</button>
        ${buildDetailsHTML(event, home, away)}
    `;

    grid.appendChild(gameDiv);
    bindDetailsToggle(gameDiv);
    gameStateMap[event.id] = buildGameState(event);
}

async function loadGames(){
    containerDiv.innerHTML = "";
    gameStateMap = {};

    const endpoint = leagues[currentLeague];
    const offsets = [0, 1, -1];
    const titles = ["Today's Games", "Tomorrow's Games", "Yesterday's Games"];
    const seenIds = new Set();

    let allEvents = [];

    for(let i = 0; i < offsets.length; i++){
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${endpoint}/scoreboard?dates=${getDate(offsets[i])}`);
        const data = await res.json();

        if(!data.events) continue;

        data.events.forEach(e => {
            if(!seenIds.has(e.id)){
                seenIds.add(e.id);
                allEvents.push({ event: e, offsetIndex: i });
            }
        });
    }

    const liveEvents = allEvents.filter(e => e.event.status.type.state === "in");
    const groupedEvents = [[], [], []];

    allEvents.forEach(e => {
        if(e.event.status.type.state !== "in"){
            groupedEvents[e.offsetIndex].push(e.event);
        }
    });

    if(liveEvents.length){
        const liveHeader = document.createElement("div");
        liveHeader.className = "section-title live-header";
        liveHeader.innerText = "🔴 Live Games";
        containerDiv.appendChild(liveHeader);

        const liveGrid = document.createElement("div");
        liveGrid.className = "content live-grid";
        containerDiv.appendChild(liveGrid);

        liveEvents
            .map(e => e.event)
            .sort((a,b) => new Date(a.date) - new Date(b.date))
            .forEach(e => renderGame(e, liveGrid));
    }

    groupedEvents.forEach((events, i) => {
        if(!events.length) return;

        const title = document.createElement("div");
        title.className = "section-title";
        title.innerText = titles[i];
        containerDiv.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "content";
        containerDiv.appendChild(grid);

        events
            .sort((a,b) => new Date(a.date) - new Date(b.date))
            .forEach(e => renderGame(e, grid));
    });

    if(currentLeague === 'NHL') {
        populateVisibleGoalies();
    }
}

async function fetchEventsForRefresh(){
    const endpoint = leagues[currentLeague];
    const offsets = [0, -1, 1];
    const allEvents = [];
    const seen = new Set();

    for(const offset of offsets){
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${endpoint}/scoreboard?dates=${getDate(offset)}`);
        const data = await res.json();

        for(const event of (data.events || [])){
            if(seen.has(event.id)) continue;
            seen.add(event.id);
            allEvents.push(event);
        }
    }

    return allEvents;
}

async function refreshLiveGames(){
    if(refreshInFlight) return;
    refreshInFlight = true;

    try {
        const events = await fetchEventsForRefresh();
        let requiresReload = false;
        let liveGameJustStarted = false;

        for(const event of events){
            const gameDiv = document.querySelector(`[data-event-id="${event.id}"]`);
            const isLive = event.status.type.state === "in";

            if(!gameDiv){
                if(isLive){
                    requiresReload = true;
                    liveGameJustStarted = true;
                }
                continue;
            }

            const previousState = gameStateMap[event.id];
            const newState = buildGameState(event);

            let previousParsed = null;
            try {
                previousParsed = previousState ? JSON.parse(previousState) : null;
            } catch (e) {
                previousParsed = null;
            }

            const comp = event.competitions[0];
            const home = comp.competitors.find(t => t.homeAway === "home");
            const away = comp.competitors.find(t => t.homeAway === "away");
            const isFinal = event.status.type.completed;

            updateStatusUI(gameDiv, event);

            const [topTeam, bottomTeam] = getSortedTeams(home, away);
            updateScoreLines(gameDiv, topTeam, bottomTeam, isLive, isFinal);
            updateScoreboardTable(gameDiv, away, home);

            gameStateMap[event.id] = newState;

            const previousLive = previousParsed?.state === "in";
            const previousCompleted = previousParsed?.completed === true;

            if(previousParsed && previousLive !== isLive){
                requiresReload = true;
                if(!previousLive && isLive){
                    liveGameJustStarted = true;
                }
            }

            if(previousParsed && previousCompleted !== isFinal){
                requiresReload = true;
            }
        }

        if(requiresReload){
            await loadGames();

            if(liveGameJustStarted){
                const liveHeader = document.querySelector(".live-header");
                if(liveHeader){
                    liveHeader.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }
            }
        }
    } catch (err) {
        console.error("Refresh failed:", err);
    } finally {
        refreshInFlight = false;
    }
}

loadGames();
setInterval(refreshLiveGames, 10000);
