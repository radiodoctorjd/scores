name: RDS Bridge - Windows build

on:
  push:
    paths:
      - "rds-bridge/**"
      - ".github/workflows/rds-bridge-windows.yml"
    tags:
      - "rds-bridge-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rds-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pyserial

      - name: Run tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build RDSBridge.exe
        run: python packaging/build_windows.py

      - name: Smoke test the exe
        run: |
          dist\RDSBridge\RDSBridge.exe --version
          dist\RDSBridge\RDSBridge.exe --config config.example.json --check
          dist\RDSBridge\RDSBridge.exe --config config.example.json --test-xml samples\wideorbit_nowplaying.xml
          python packaging/smoke_test.py dist\RDSBridge\RDSBridge.exe

      - name: Upload the Windows program folder
        uses: actions/upload-artifact@v4
        with:
          name: RDSBridge-windows
          path: rds-bridge/dist/RDSBridge/

      - name: Publish release (tags rds-bridge-v*)
        if: startsWith(github.ref, 'refs/tags/rds-bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: rds-bridge/dist/RDSBridge-windows.zip
